<!doctype html>
<!--
  Knock page. Published as index.html on GitHub Pages
  (github.com/remitoshniwal/spongebox). It holds no address and no secret: you type the
  server address and the knock password; the password is hashed here (PBKDF2-SHA256,
  1,000,000 rounds, in the browser) and never sent anywhere. Chunks 1-7 go out as background requests, chunk 8
  as a normal page visit, so the server's login cookie sticks.
  Add #<address> to the page URL to fill the address in (the part after # is never sent
  to GitHub or the server).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>spongebox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #000; --paper: #fff; --muted: #777; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--paper); color: var(--ink); font: 15px/1.4 "Space Mono", ui-monospace, Menlo, monospace; }
  form { width: 100%; max-width: 320px; border: 1.5px solid var(--ink); padding: 28px 24px;
         display: grid; gap: 20px; }
  label { display: grid; gap: 8px; }
  input { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink);
          border-radius: 0; padding: 10px 12px; width: 100%; outline: none; }
  input:focus { box-shadow: 3px 3px 0 var(--ink); }
  button { justify-self: end; font: inherit; font-weight: 700; color: var(--ink); background: var(--paper);
           border: 1.5px solid var(--ink); padding: 6px 18px; cursor: pointer; }
  button:hover, button:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
  button:disabled { opacity: .4; cursor: default; background: var(--paper); color: var(--ink); }
  #status { margin: -8px 0 0; min-height: 1.4em; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <label>server address<input id="addr" required inputmode="url" autocapitalize="off" spellcheck="false"></label>
  <label>password<input id="pw" type="password" required></label>
  <button id="go" aria-label="open">&rarr;</button>
  <p id="status"></p>
</form>
<script>
  // Must match SALT and ROUNDS on the server (set-password.sh). Not secret.
  const SALT = "d9f15908645476b47c7e31d8282dc671", ROUNDS = 1000000;

  // PBKDF2-SHA256 of the password: 64 hex characters, deliberately slow (about a second).
  async function knockHash(password) {
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: enc.encode(SALT), iterations: ROUNDS }, key, 256);
    return Array.from(new Uint8Array(bits), b => b.toString(16).padStart(2, "0")).join("");
  }

  const $ = id => document.getElementById(id);
  $("addr").value = decodeURIComponent(location.hash.slice(1));
  ($("addr").value ? $("pw") : $("addr")).focus();

  $("f").addEventListener("submit", async e => {
    e.preventDefault();
    const host = $("addr").value.trim().replace(/^https?:\/\//, "").replace(/\/.*$/, "");
    $("go").disabled = true;
    $("status").textContent = "opening…";
    const hex = await knockHash($("pw").value);
    const chunks = hex.match(/.{8}/g);
    $("pw").value = "";
    try {
      for (const c of chunks.slice(0, 7)) {
        await fetch(`https://${host}/${c}`, { mode: "no-cors", cache: "no-store", credentials: "omit", referrerPolicy: "no-referrer" });
      }
    } catch {
      $("status").textContent = "can't reach that address";
      $("go").disabled = false;
      return;
    }
    location.href = `https://${host}/${chunks[7]}`;
  });
</script>
</body>
</html>
